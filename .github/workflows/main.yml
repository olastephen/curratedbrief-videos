name: Render videos

on:
  # Run it by hand from the Actions tab
  workflow_dispatch:
    inputs:
      composition:
        description: Which video to render
        type: choice
        default: all
        options: [all, DailyBrief, ByTheNumbers, AutomateThis]
  # Make (or any tool) can trigger this later with the day's props JSON
  repository_dispatch:
    types: [render-video]

permissions:
  contents: read

jobs:
  # Make runs twice a day (about 10:40 and 1pm UK time); the second run is a backup.
  # This stops the backup posting a second video when an earlier run already succeeded today.
  check:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - id: today
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Midnight UK time today, written in UTC for GitHub's search
          since=$(date -u -d @"$(TZ=Europe/London date -d "$(TZ=Europe/London date +%F) 00:00" +%s)" +%FT%TZ)
          # If GitHub can't be asked, post anyway: a duplicate draft is better than a missed day
          posted=$(gh api -X GET "repos/$REPO/actions/workflows/main.yml/runs" \
            -f event=repository_dispatch -f status=success -f created=">=$since" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length") || posted=0
          if [ "$posted" -gt 0 ]; then
            echo "Today's video was already posted by an earlier run, so this backup run does nothing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No video posted yet today, so this run will render and post."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  render:
    needs: check
    if: needs.check.outputs.skip != 'true'
    # Pinned (not ubuntu-latest) so GitHub's move to Ubuntu 26 can't change the render machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Libraries Remotion's headless Chrome needs on Ubuntu 24.04
      # (list from remotion.dev/docs/miscellaneous/linux-dependencies)
      - name: Install browser system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64

      - name: Download headless browser
        run: npx remotion browser ensure

      - name: Render templates (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out
          if [ "$COMP" = "all" ]; then
            npm run render:all
          else
            npx remotion render "$COMP" "out/$COMP.mp4"
          fi

      - name: Render today's video (triggered by Make)
        if: github.event_name == 'repository_dispatch'
        env:
          PROPS: ${{ toJSON(github.event.client_payload.props) }}
          COMP: ${{ github.event.client_payload.composition || 'DailyBrief' }}
        run: |
          case "$COMP" in DailyBrief|ByTheNumbers|AutomateThis) ;; *) echo "Unknown composition: $COMP"; exit 1 ;; esac
          mkdir -p out
          printf '%s' "$PROPS" > props/today.json
          npx remotion render "$COMP" out/today.mp4 --props=./props/today.json

      - uses: actions/upload-artifact@v7
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14

      # Posts the video to YouTube, LinkedIn, Instagram, TikTok and X through Postiz.
      # Only runs for Make-triggered renders, never for manual template runs.
      # Starts as drafts in Postiz; set the repository variable POST_MODE=schedule to go live.
      - name: Post to social media (via Postiz)
        if: github.event_name == 'repository_dispatch'
        timeout-minutes: 10
        env:
          POSTIZ_API_URL: ${{ secrets.POSTIZ_API_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          POST_MODE: ${{ vars.POST_MODE || 'draft' }}
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
          VIDEO: out/today.mp4
        run: node scripts/publish.mjs
