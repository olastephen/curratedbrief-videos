name: Render videos

on:
  # Run it by hand from the Actions tab
  workflow_dispatch:
    inputs:
      composition:
        description: Which video to render
        type: choice
        default: all
        options: [all, DailyBrief, ByTheNumbers, AutomateThis]
  # Make (or any tool) can trigger this later with the day's props JSON
  repository_dispatch:
    types: [render-video]

permissions:
  contents: read

jobs:
  render:
    # Pinned (not ubuntu-latest) so GitHub's move to Ubuntu 26 can't change the render machine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Libraries Remotion's headless Chrome needs on Ubuntu 24.04
      # (list from remotion.dev/docs/miscellaneous/linux-dependencies)
      - name: Install browser system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64

      - name: Download headless browser
        run: npx remotion browser ensure

      - name: Render templates (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out
          if [ "$COMP" = "all" ]; then
            npm run render:all
          else
            npx remotion render "$COMP" "out/$COMP.mp4"
          fi

      - name: Render today's video (triggered by Make)
        if: github.event_name == 'repository_dispatch'
        env:
          PROPS: ${{ toJSON(github.event.client_payload.props) }}
          COMP: ${{ github.event.client_payload.composition || 'DailyBrief' }}
        run: |
          case "$COMP" in DailyBrief|ByTheNumbers|AutomateThis) ;; *) echo "Unknown composition: $COMP"; exit 1 ;; esac
          mkdir -p out
          printf '%s' "$PROPS" > props/today.json
          npx remotion render "$COMP" out/today.mp4 --props=./props/today.json

      - uses: actions/upload-artifact@v7
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
